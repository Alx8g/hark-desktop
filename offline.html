<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hark — Offline</title>
    <link rel="stylesheet" href="/src/shell.css" />
    <style>
      body { display: grid; place-items: center; }
      .box { width: min(420px, calc(100vw - 48px)); padding: 34px 36px 30px; text-align: center; }
      h1 { font-size: 21px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 8px; }
      p { font-size: 14px; line-height: 1.5; color: var(--ink-70); }
      .actions { margin-top: 22px; display: flex; gap: 8px; justify-content: center; }
    </style>
  </head>
  <body>
    <main class="card box drag" data-tauri-drag-region>
      <div class="wordmark" style="font-size:26px">hark <em>pro</em></div>
      <h1 style="margin-top:18px">You&rsquo;re offline</h1>
      <p>Hark lives in the cloud, so there is nothing stale to show you here. As soon as your connection is back, your brief, panels and plans are right where you left them.</p>
      <div class="actions no-drag">
        <button class="pill-btn primary" id="retry">Try again</button>
        <button class="pill-btn" id="hide">Hide to tray</button>
      </div>
    </main>
    <script type="module" src="/src/offline.ts"></script>
  </body>
</html>
