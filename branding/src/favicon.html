<!doctype html>
<!-- Website favicon: the app tile on a transparent background. Rendered at 64x64. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="brand.css" />
    <style>
      html, body { width: 64px; height: 64px; background: transparent; overflow: hidden; }
      .tile { --s: 60px; position: absolute; left: 2px; top: 2px; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18); }
    </style>
  </head>
  <body>
    <div class="tile"></div>
  </body>
</html>
