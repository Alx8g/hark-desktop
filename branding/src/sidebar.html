<!doctype html>
<!-- Installer welcome/finish sidebar. Rendered at 164x314 (see branding/build.mjs). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="brand.css" />
    <style>
      html, body { width: 164px; height: 314px; overflow: hidden; }
      body { position: relative; font-family: var(--font); }
      .tile { --s: 76px; position: absolute; left: 44px; top: 40px; }
      .wordmark { position: absolute; left: 0; right: 0; top: 144px; text-align: center; font-size: 34px; }
      .sub { position: absolute; left: 0; right: 0; top: 188px; text-align: center; font-size: 10.5px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-50); font-weight: 600; }
      .pill { position: absolute; left: 22px; right: 22px; bottom: 26px; justify-content: center; padding: 9px 0; font-size: 10.5px; font-weight: 550; }
    </style>
  </head>
  <body class="sky">
    <div class="tile"></div>
    <div class="wordmark">hark <em>pro</em></div>
    <div class="sub">Desktop</div>
    <div class="pill">Unofficial client</div>
  </body>
</html>
