<!doctype html>
<!-- Social preview banner for the repository and the website. Rendered at 1280x640 (see branding/build.mjs). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="brand.css" />
    <style>
      @font-face { font-family: "Newsreader"; font-style: normal; font-weight: 200 800; src: url("/docs/assets/fonts/newsreader-opsz.woff2") format("woff2-variations"); }
      @font-face { font-family: "Newsreader"; font-style: italic; font-weight: 200 800; src: url("/docs/assets/fonts/newsreader-italic.woff2") format("woff2-variations"); }
      @font-face { font-family: "Inter Tight"; font-weight: 100 900; src: url("/docs/assets/fonts/inter-tight.woff2") format("woff2-variations"); }
      html, body { width: 1280px; height: 640px; overflow: hidden; }
      body { position: relative; background: radial-gradient(110% 80% at 74% -12%, #2f4688 0%, #1b2858 38%, #151b3a 62%, #141414 100%); font-family: "Inter Tight", var(--font); color: #fff; }
      .brand { position: absolute; left: 80px; top: 64px; display: flex; align-items: center; gap: 18px; }
      .brand .tile { --s: 64px; }
      .brand b { font: 400 46px/1 "Newsreader", var(--serif); letter-spacing: -0.025em; }
      .brand i { font: italic 400 46px/1 "Newsreader", var(--serif); color: rgba(255, 255, 255, 0.5); letter-spacing: -0.025em; }
      h1 { position: absolute; left: 80px; top: 196px; font: 400 112px/1 "Newsreader", var(--serif); letter-spacing: -0.035em; }
      h1 em { color: rgba(255, 255, 255, 0.5); }
      p { position: absolute; left: 84px; top: 470px; font: 500 30px/1.3 "Inter Tight", var(--font); color: #f5f5f7; letter-spacing: -0.01em; }
      .pill { position: absolute; left: 84px; bottom: 56px; padding: 14px 26px; border-radius: 24px; background: #f5f5f7; color: #1d1d1f; font-size: 22px; font-weight: 550; }
      .glow { position: absolute; right: -140px; bottom: -220px; width: 760px; height: 520px; background: radial-gradient(closest-side, rgba(120, 200, 215, 0.7), rgba(56, 108, 205, 0.45) 55%, rgba(20, 20, 20, 0) 100%); }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="brand"><div class="tile"></div><b>hark</b><i>desktop</i></div>
    <h1>Hark, in its<br /><em>own window.</em></h1>
    <p>An unofficial desktop app for Windows, macOS and Linux.</p>
    <div class="pill">Free and open source</div>
  </body>
</html>
