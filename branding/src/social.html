<!doctype html>
<!-- Social preview banner for the repository and the website. Rendered at 1280x640 (see branding/build.mjs). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="brand.css" />
    <style>
      @font-face { font-family: "Newsreader"; font-style: normal; font-weight: 200 800; src: url("/docs/assets/fonts/newsreader-opsz.woff2") format("woff2-variations"); }
      @font-face { font-family: "Newsreader"; font-style: italic; font-weight: 200 800; src: url("/docs/assets/fonts/newsreader-italic.woff2") format("woff2-variations"); }
      @font-face { font-family: "Inter Tight"; font-weight: 100 900; src: url("/docs/assets/fonts/inter-tight.woff2") format("woff2-variations"); }
      html, body { width: 1280px; height: 640px; overflow: hidden; }
      body { position: relative; background: radial-gradient(110% 80% at 74% -12%, #2f4688 0%, #1b2858 38%, #151b3a 62%, #141414 100%); font-family: "Inter Tight", var(--font); color: #fff; }
      .glow { position: absolute; right: -140px; bottom: -220px; width: 760px; height: 520px; background: radial-gradient(closest-side, rgba(120, 200, 215, 0.6), rgba(56, 108, 205, 0.4) 55%, rgba(20, 20, 20, 0) 100%); }
      .brand { position: absolute; left: 76px; top: 64px; display: flex; align-items: center; gap: 18px; }
      .brand .tile { --s: 64px; }
      .brand b { font: 400 48px/1 "Newsreader", var(--serif); letter-spacing: -0.025em; }
      .brand i { font: italic 400 48px/1 "Newsreader", var(--serif); color: rgba(255, 255, 255, 0.5); letter-spacing: -0.025em; }
      h1 { position: absolute; left: 76px; font: 400 120px/0.98 "Newsreader", var(--serif); letter-spacing: -0.035em; }
      h1 em { color: rgba(255, 255, 255, 0.5); }
      .ring { position: relative; flex: none; display: grid; place-items: center; }
      .ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
      .send { flex: none; display: grid; place-items: center; border-radius: 50%; background: #1d1d1f; }
    </style>
    <style>
      h1 { top: 196px; }
      .scene { position: absolute; left: 700px; top: 120px; width: 520px; height: 400px; border-radius: 40px; overflow: hidden; box-shadow: 0 40px 90px rgba(4, 10, 40, 0.55), inset 0 0 0 1px rgba(255, 255, 255, 0.25); }
      .warm { position: absolute; inset: auto 0 0 0; height: 50%; background: linear-gradient(rgba(255, 214, 186, 0), rgba(246, 190, 150, 0.6)); }
      .little { position: absolute; left: 32px; right: 32px; top: 70px; }
      .hello { font: 400 66px/1.02 "Newsreader", var(--serif); letter-spacing: -0.03em; color: #1d1d1f; margin: 0 6px 34px; }
      .hello i { display: block; color: rgba(29, 29, 31, 0.6); }
      .bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 14px 14px 30px; border-radius: 60px; background: rgba(255, 255, 255, 0.88); box-shadow: inset 0 0 0 1px rgba(29, 29, 31, 0.08), 0 16px 40px rgba(20, 40, 90, 0.25); font: 500 34px/1.2 "Inter Tight", var(--font); color: rgba(29, 29, 31, 0.55); }
      .bar .send { width: 64px; height: 64px; }
</style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="brand"><div class="tile"></div><b>hark</b><i>desktop</i></div>
    <h1>Hark, in its<br /><em>own window.</em></h1>
    <div class="scene sky"><div class="warm"></div>
      <div class="little"><div class="hello">Good morning. <i>What's first?</i></div><div class="bar"><span>Ask Hark</span><span class="send"><svg viewBox="0 0 16 16" width="46%" height="46%" fill="none" stroke="#f9f9fa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V3M3.5 7.5L8 3l4.5 4.5" /></svg></span></div></div>
    </div>
  </body>
</html>
