<!doctype html>
<!-- The Hark Desktop mark: a serif "h" (the same letterform as the wordmark), cut out as a mask by build.mjs. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; width: 1024px; height: 1024px; background: transparent; overflow: hidden; }
      body { display: grid; place-items: center; }
      span { font-family: Georgia, "Times New Roman", serif; font-size: 820px; line-height: 1; color: #fff; }
    </style>
  </head>
  <body><span>h</span></body>
</html>
