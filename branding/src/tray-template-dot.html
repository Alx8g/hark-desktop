<!doctype html>
<!-- Menu bar glyph with an unread dot. One colour only, so the dot is a solid circle and the glyph gives it a clear ring. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; width: 44px; height: 44px; background: transparent; overflow: hidden; }
      .g {
        position: absolute; inset: 0; background: #000;
        -webkit-mask: url("../mark.png") 30% 70% / 74% no-repeat, radial-gradient(circle at 34px 10px, #000 0 10.5px, transparent 11px);
        -webkit-mask-composite: source-out;
        mask: url("../mark.png") 30% 70% / 74% no-repeat, radial-gradient(circle at 34px 10px, #000 0 10.5px, transparent 11px);
        mask-composite: subtract;
      }
      .d { position: absolute; left: 28px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: #000; }
    </style>
  </head>
  <body><div class="g"></div><div class="d"></div></body>
</html>
