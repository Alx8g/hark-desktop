<!doctype html>
<!-- macOS disk image background. Rendered at 660x400 to match bundle.macOS.dmg in tauri.conf.json. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="brand.css" />
    <style>
      html, body { width: 660px; height: 400px; overflow: hidden; }
      body { position: relative; font-family: var(--font); }
      h1 { position: absolute; left: 0; right: 0; top: 34px; text-align: center; font-family: var(--serif); font-weight: 400; font-size: 30px; letter-spacing: -0.02em; color: var(--ink); }
      p { position: absolute; left: 0; right: 0; bottom: 28px; text-align: center; font-size: 12.5px; color: var(--ink-50); }
      svg { position: absolute; left: 270px; top: 178px; width: 120px; height: 44px; }
    </style>
  </head>
  <body class="sky">
    <h1>Drag hark to Applications</h1>
    <svg viewBox="0 0 120 44" fill="none" stroke="rgba(29,29,31,.38)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M8 22h100M92 8l16 14-16 14" />
    </svg>
    <p>Unofficial client. Not affiliated with Hark.</p>

</html>
