<!doctype html>
<!-- Installer page header art. Rendered at 150x57 on white (see branding/build.mjs). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="brand.css" />
    <style>
      html, body { width: 150px; height: 57px; overflow: hidden; background: #fff; }
      body { display: flex; align-items: center; gap: 9px; padding-left: 14px; font-family: var(--font); }
      .tile { --s: 32px; box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.2), 0 1.5px 4px rgba(29, 29, 31, 0.28); }
      .wordmark { font-size: 24px; }
    </style>
  </head>
  <body>
    <div class="tile"></div>
    <div class="wordmark">hark <em>pro</em></div>
  </body>
</html>
