<!doctype html>
<!-- macOS menu bar glyph: black on transparent, which macOS tints for light and dark menu bars. 44x44 (22pt at 2x). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; width: 44px; height: 44px; background: transparent; overflow: hidden; }
      .g { width: 44px; height: 44px; background: #000; -webkit-mask: url("../mark.png") center / 86% no-repeat; mask: url("../mark.png") center / 86% no-repeat; }
    </style>
  </head>
  <body><div class="g"></div></body>
</html>
