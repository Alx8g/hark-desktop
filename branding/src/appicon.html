<!doctype html>
<!-- Master app icon at 1024x1024, transparent corners. `tauri icon` turns it into every platform size. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="brand.css" />
    <style>
      html, body { margin: 0; width: 1024px; height: 1024px; background: transparent; overflow: hidden; }
      .tile { --s: 944px; position: absolute; left: 40px; top: 40px; box-shadow: inset 0 0 0 10px rgba(255, 255, 255, 0.16), inset 0 14px 30px rgba(255, 255, 255, 0.1); }
    </style>
  </head>
  <body><div class="tile"></div></body>
</html>
