<!doctype html>
<html lang="en" data-bare>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ask Hark</title>
    <link rel="stylesheet" href="/src/shell.css" />
    <style>
      /* The window is transparent; the margin round the panel holds its shadow. Clicking the margin closes the box. */
      body { padding: 22px 40px 58px; }
      .little { position: relative; border-radius: 24px; padding: 18px 20px 20px; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.5), 0 30px 70px -20px rgba(8, 24, 60, 0.65), 0 8px 18px -8px rgba(8, 24, 60, 0.3); }
      .little.show { animation: arrive 0.2s var(--ease-out); }
      @keyframes arrive { from { opacity: 0; transform: translateY(-8px) scale(0.98); } }
      .hello { font: 400 31px/1.12 var(--serif); letter-spacing: -0.025em; margin: 4px 4px 16px; }
      .hello i { color: var(--ink-60); }
      .composer { display: flex; align-items: flex-start; gap: 10px; padding: 10px 10px 10px 20px; border-radius: 28px; background: rgba(255, 255, 255, 0.82); box-shadow: inset 0 0 0 1px rgba(29, 29, 31, 0.08), 0 8px 24px rgba(29, 29, 31, 0.08); transition: border-radius 0.2s; }
      .little.multi .composer { border-radius: 22px; }
      textarea { flex: 1; border: 0; outline: 0; resize: none; background: transparent; font: 430 17px/1.4 var(--sans); color: var(--ink); padding: 7px 0 0; height: 32px; max-height: 148px; overflow-y: auto; user-select: text; cursor: text; }
      textarea::placeholder { color: rgba(29, 29, 31, 0.4); }
      .send { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 0; padding: 0; display: grid; place-items: center; background: var(--ink-06); color: var(--ink-30); cursor: pointer; transition: background 0.2s, color 0.2s; }
      .send.on { background: var(--ink); color: #fff; }
      /* Linux can't be relied on for a transparent window: the panel fills it instead. */
      html[data-platform="linux"] body { padding: 0; }
      html[data-platform="linux"] .little { border-radius: 0; box-shadow: none; }
    </style>
  </head>
  <body>
    <main class="little sky" id="panel">
      <div class="hello" id="hello" data-tauri-drag-region></div>
      <div class="composer">
        <textarea id="input" rows="1" placeholder="Ask Hark anything" aria-label="Ask Hark anything"></textarea>
        <button class="send" id="send" aria-label="Open in Hark"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 13V3.5M3.8 7.6 8 3.4l4.2 4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </main>
    <script type="module" src="/src/quick.ts"></script>
  </body>
</html>
