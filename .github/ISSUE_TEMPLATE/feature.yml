name: Feature request
description: Suggest something the desktop app could do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: Describe the situation first, then the feature you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen
  - type: dropdown
    id: system
    attributes:
      label: Which systems
      multiple: true
      options:
        - Windows
        - macOS
        - Linux
