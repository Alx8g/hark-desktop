name: Smoke test

# Install a published release (or build the chosen branch) on GitHub's macOS and Linux machines, open it,
# and keep screenshots and the app's log as run artifacts. Nobody signs in: it shows the loading screen,
# then hark.com's sign-in page. Run it by hand from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release to test, for example v0.2.2. Leave empty to build the branch instead.
        required: false
        default: ""

permissions:
  contents: read

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Download the disk image
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ inputs.tag }}" --repo "${{ github.repository }}" --pattern "*_universal.dmg" --dir dl

      - uses: actions/checkout@v7
        if: inputs.tag == ''
      - uses: pnpm/action-setup@v6
        if: inputs.tag == ''
      - uses: actions/setup-node@v7
        if: inputs.tag == ''
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        if: inputs.tag == ''
      - uses: swatinem/rust-cache@v2
        if: inputs.tag == ''
        with:
          workspaces: src-tauri
      - name: Build the branch
        if: inputs.tag == ''
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build --bundles app
          mkdir -p built && cp -R src-tauri/target/release/bundle/macos/*.app built/

      - name: Install
        run: |
          if [ -d built ]; then cp -R built/*.app /Applications/; else
            hdiutil attach dl/*.dmg -mountpoint /Volumes/hark -nobrowse -quiet
            cp -R /Volumes/hark/*.app /Applications/
            hdiutil detach /Volumes/hark -quiet
          fi
          # Not notarised: what "right click, Open" does for a person.
          xattr -cr /Applications/Hark.app
          ls /Applications/Hark.app/Contents/MacOS

      - name: Open it and take screenshots
        run: |
          mkdir -p out
          bin=$(ls /Applications/Hark.app/Contents/MacOS/* | head -1)
          HARK_DESKTOP_LOG=1 "$bin" > out/app.log 2>&1 &
          echo $! > out/pid
          for t in 2 6 12 25 40; do
            sleep $(( t - ${last:-0} )); last=$t
            screencapture -x "out/after-${t}s.png" || true
          done
          if kill -0 "$(cat out/pid)" 2>/dev/null; then echo "still running after 40 s" | tee out/result.txt; else echo "EXITED" | tee out/result.txt; fi
          # Window list, through the system's own records (no accessibility permission needed).
          python3 -m venv /tmp/q && /tmp/q/bin/pip install -q pyobjc-framework-Quartz
          /tmp/q/bin/python - <<'EOF' | tee out/windows.txt
          import Quartz
          for w in Quartz.CGWindowListCopyWindowInfo(Quartz.kCGWindowListOptionOnScreenOnly, Quartz.kCGNullWindowID):
              if w.get("kCGWindowOwnerName", "").lower().startswith("hark"):
                  b = w.get("kCGWindowBounds", {})
                  print(w.get("kCGWindowOwnerName"), "|", w.get("kCGWindowName", ""), "|", int(b.get("Width", 0)), "x", int(b.get("Height", 0)), "at", int(b.get("X", 0)), int(b.get("Y", 0)), "| layer", w.get("kCGWindowLayer"))
          EOF
          grep -q "still running" out/result.txt

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-macos
          path: out/

  linux:
    name: Linux
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Download the deb
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ inputs.tag }}" --repo "${{ github.repository }}" --pattern "*_amd64.deb" --dir dl

      - uses: actions/checkout@v7
        if: inputs.tag == ''
      - uses: pnpm/action-setup@v6
        if: inputs.tag == ''
      - uses: actions/setup-node@v7
        if: inputs.tag == ''
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        if: inputs.tag == ''
      - uses: swatinem/rust-cache@v2
        if: inputs.tag == ''
        with:
          workspaces: src-tauri
      - name: Build the branch
        if: inputs.tag == ''
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
          pnpm install --frozen-lockfile
          pnpm tauri build --bundles deb
          mkdir -p dl && cp src-tauri/target/release/bundle/deb/*.deb dl/

      - name: Install it, a virtual screen and a window manager
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq ./dl/*.deb xvfb openbox imagemagick x11-utils dbus-x11 at-spi2-core

      - name: Open it and take screenshots
        run: |
          mkdir -p out
          export DISPLAY=:99
          Xvfb :99 -screen 0 1600x1000x24 & sleep 2
          openbox & sleep 1
          bin=$(dpkg -L hark | grep -E '^/usr/bin/' | head -1)
          # A virtual screen has no GPU: WebKitGTK's usual advice for VMs.
          export WEBKIT_DISABLE_DMABUF_RENDERER=1
          echo "binary: $bin"
          HARK_DESKTOP_LOG=1 dbus-run-session -- "$bin" > out/app.log 2>&1 &
          echo $! > out/pid
          for t in 2 6 12 25 40; do
            sleep $(( t - ${last:-0} )); last=$t
            import -window root "out/after-${t}s.png" || true
          done
          if kill -0 "$(cat out/pid)" 2>/dev/null; then echo "still running after 40 s" | tee out/result.txt; else echo "EXITED" | tee out/result.txt; fi
          xwininfo -root -tree | grep -i hark | tee out/windows.txt || true
          grep -q "still running" out/result.txt

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-linux
          path: out/
