name: Release

# Push a tag such as v0.2.0 to build every platform and attach the packages to a draft release.
# Run it by hand (Actions tab, Run workflow) for a dry run: it builds everything and keeps the
# packages as run artifacts, without creating a tag or a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ""
          - name: macOS (Apple silicon and Intel)
            os: macos-latest
            args: --target universal-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            args: ""
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            src-setup
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update packages (latest.json); the public key is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Hark Desktop ${{ github.ref_name }}
          releaseBody: |
            Download the file for your system below. These builds are not code-signed:
            on Windows choose More info, then Run anyway; on macOS open the app with a right click, then Open.
          releaseDraft: true
          prerelease: false
          # Update packages and latest.json only here, so builds without the key still work.
          args: ${{ matrix.args }} --config src-tauri/tauri.updater.conf.json
          # Updates use the per-user setup.exe, which Hark-Desktop-Setup.exe also carries.
          updaterJsonPreferNsis: true
      # The download people get on Windows: the sky card, carrying the setup.exe built above and running it silently.
      - name: Build Hark-Desktop-Setup.exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $env:HARK_SETUP_PAYLOAD = (Resolve-Path "src-tauri/target/release/bundle/nsis/Hark_${version}_x64-setup.exe").Path
          cargo build --release --manifest-path src-setup/Cargo.toml
          New-Item -ItemType Directory -Force setup-out | Out-Null
          Copy-Item src-setup/target/release/hark-setup.exe setup-out/Hark-Desktop-Setup.exe
      - name: Attach Hark-Desktop-Setup.exe to the draft release
        if: runner.os == 'Windows' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} setup-out/Hark-Desktop-Setup.exe --clobber
      - name: Keep the packages from a manual run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ runner.os }}
          retention-days: 3
          path: |
            src-tauri/target/**/bundle/deb/*.deb
            src-tauri/target/**/bundle/rpm/*.rpm
            src-tauri/target/**/bundle/appimage/*.AppImage
            src-tauri/target/**/bundle/dmg/*.dmg
            src-tauri/target/**/bundle/msi/*.msi
            src-tauri/target/**/bundle/nsis/*.exe
            setup-out/*.exe
