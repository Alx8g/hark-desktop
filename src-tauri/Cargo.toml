[package]
name = "hark-windows"
version = "0.2.1"
description = "Hark Desktop: a lightweight, unofficial native client for hark.com"
authors = ["Hark Desktop contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "hark_windows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: needed for transparent (rounded) windows on macOS. No effect on Windows/Linux.
tauri = { version = "2.12.4", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-store = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Keep the shell tiny and fast: the whole product is this binary + WebView2.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
